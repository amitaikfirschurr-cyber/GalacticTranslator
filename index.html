<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מתרגם שפת הכישופים - מיינקראפט</title>
</head>
<body style="margin: 0; background-color: #1d1d1d;">

<div style="font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1d1d1d; color: #fff; text-align: center; padding: 40px 20px; min-height: 100vh;">
    <h1 style="color: #55ff55; text-shadow: 2px 2px #000;">⚔️ מתרגם שפת הכישופים ⚔️</h1>
    <p style="color: #aaa;">הקלד בכל אחת מהתיבות כדי לתרגם מיד לשני הכיוונים</p>

    <div style="max-width: 500px; margin: 20px auto;">
        <label style="display: block; text-align: left; margin-bottom: 5px; color: #55ff55;">English (אנגלית):</label>
        <textarea id="engBox" oninput="toMinecraft()" placeholder="Type in English here..." style="width: 100%; height: 100px; font-size: 18px; padding: 12px; border-radius: 8px; border: 2px solid #555; background: #2b2b2b; color: white; box-sizing: border-box;"></textarea>
        <button onclick="copyText('engBox')" style="margin-top: 8px; padding: 8px 16px; background: #3c8527; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">העתק אנגלית 📋</button>
    </div>

    <div style="max-width: 500px; margin: 30px auto;">
        <label style="display: block; text-align: left; margin-bottom: 5px; color: #d67dff;">Enchanting Table (מיינקראפט):</label>
        <textarea id="mcBox" oninput="fromMinecraft()" placeholder="∷⚍リᒷᓭ ⍑ᒷ∷ᒷ..." style="width: 100%; height: 100px; font-size: 22px; padding: 12px; border-radius: 8px; border: 2px solid #9b4dca; background: #2b2b2b; color: #e0aaff; box-sizing: border-box;"></textarea>
        <button onclick="copyText('mcBox')" style="margin-top: 8px; padding: 8px 16px; background: #7b2cbf; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">העתק מיינקראפט 📋</button>
    </div>
</div>

<script>
    const alphabet = {
        'a': 'ᔑ', 'b': 'ʖ', 'c': 'ᓵ', 'd': '↸', 'e': 'ᒷ',
        'f': '⎓', 'g': '⊣', 'h': '⍑', 'i': '╎', 'j': '⋮',
        'k': 'ꖌ', 'l': 'ꖎ', 'm': 'ᒲ', 'n': 'リ', 'o': '𝙹',
        'p': '!¡', 'q': 'ᑑ', 'r': '∷', 's': 'ᓭ', 't': 'ℸ ̣',
        'u': '⚍', 'v': '⍊', 'w': '∴', 'x': '̇/', 'y': '∥',
        'z': '⨅'
    };

    function toMinecraft() {
        const text = document.getElementById('engBox').value.toLowerCase();
        let result = '';
        for (let char of text) {
            result += alphabet[char] || char;
        }
        document.getElementById('mcBox').value = result;
    }

    function fromMinecraft() {
        let text = document.getElementById('mcBox').value;
        text = text.replaceAll('!¡', 'p').replaceAll('ℸ ̣', 't').replaceAll('̇/', 'x');
        
        const reverseAlphabet = {};
        for (let key in alphabet) {
            if (alphabet[key].length === 1) {
                reverseAlphabet[alphabet[key]] = key;
            }
        }

        let result = '';
        for (let char of text) {
            result += reverseAlphabet[char] || char;
        }
        document.getElementById('engBox').value = result;
    }

    function copyText(boxId) {
        const box = document.getElementById(boxId);
        box.select();
        navigator.clipboard.writeText(box.value);
        alert("הטקסט הועתק בהצלחה!");
    }
</script>

</body>
</html>
